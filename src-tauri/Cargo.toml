[package]
name = "nuzlike-patcher-app"
version = "0.1.0-alpha.2"
description = "ROM-free cross-platform NuzLike patcher"
authors = ["NuzLike contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.85"

[lib]
name = "nuzlike_patcher_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nuzlike-patcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
flate2 = "1"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
