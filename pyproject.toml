[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quickloke-patcher"
version = "0.1.0.dev0"
description = "ROM-free structured patcher for Quicklocke"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.scripts]
quickloke-patcher = "quickloke_patcher.cli:main"

[tool.setuptools]
packages = ["quickloke_patcher"]
