name: app-builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fvx-engine:
    name: Build pinned randomizer engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: msmfai/universal-pokemon-randomizer-fvx
          ref: d824655b5b6e303d000b7463daa49d6a279b1117
          path: .fvx-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build and test FVX bridge
        run: .fvx-source/gradlew -p .fvx-source :random:jar :random:quicklockeBridgeTest
      - uses: actions/upload-artifact@v4
        with:
          name: fvx-engine
          path: .fvx-source/random/build/libs/UPR-FVX.jar
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x86-64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: Linux x86-64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: fvx-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fvx-engine
          path: .engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Temurin 17 is unavailable on GitHub's Windows ARM runner. FVX is
          # compiled for Java 17 and runs unchanged on this Java 21 runtime.
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: npm ci
      - name: Bundle FVX and minimal Java runtime
        run: python tools/prepare_desktop_fvx.py --jar .engine/UPR-FVX.jar
      - name: Build native package
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Package Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/quickloke-${{ matrix.target }}.tar.gz" -C "src-tauri/target/${{ matrix.target }}/release/bundle" .
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path "src-tauri/target/${{ matrix.target }}/release/bundle/*" -DestinationPath "release-assets/quickloke-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: quickloke-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  android:
    name: Android ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            rust_target: aarch64-linux-android
            tauri_target: aarch64
            artifact: quickloke-android-arm64
          - name: x86-64
            rust_target: x86_64-linux-android
            tauri_target: x86_64
            artifact: quickloke-android-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: fvx-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fvx-engine
          path: .engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - run: npm ci
      - name: Initialize Android project
        run: npm run android:init -- --ci
      - name: Install FVX Android bridge
        run: python tools/prepare_android_fvx.py --jar .engine/UPR-FVX.jar
      - name: Build split APKs
        run: npm run android:build -- --target ${{ matrix.tauri_target }} --apk --split-per-abi --ci
      - name: Name release APK
        run: |
          mkdir -p release-assets
          cp src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk "release-assets/${{ matrix.artifact }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*.apk
          if-no-files-found: error

  release:
    name: Publish tagged binaries
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: quickloke-*
          path: release-assets
          merge-multiple: true
      - name: Create pre-alpha release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPOSITORY" || gh release create "$TAG" --repo "$REPOSITORY" --prerelease --title "[Pre-Alpha] Quicklocke $TAG" --notes "Pre-alpha build. This release is incomplete and may softlock; keep backups of your saves. Includes the combined FVX randomizer and Quicklocke patcher for every supported game."
          gh release upload "$TAG" release-assets/* --repo "$REPOSITORY" --clobber
