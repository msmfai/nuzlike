name: app-builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-checks:
    name: Test public source and history
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python tools/release_audit.py --tree . --history

  fvx-engine:
    name: Build pinned randomizer engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: msmfai/nuzlike-randomizer-fvx
          ref: 849961023a4b39db31a996d0ca3a6afe4d3446cd
          path: .fvx-source
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build and test FVX bridge
        run: .fvx-source/gradlew -p .fvx-source :random:jar :random:nuzlikeBridgeTest
      - uses: actions/upload-artifact@v7
        with:
          name: fvx-engine
          path: .fvx-source/random/build/libs/UPR-FVX.jar
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            # The release artifact is a tarball of the native .app bundle.
            # Avoid DMG creation here: Tauri's Finder/AppleScript DMG helper is
            # unreliable on headless Intel runners and the DMG is redundant.
            bundles: app
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - name: Windows x86-64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: Linux x86-64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: fvx-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fvx-engine
          path: .engine
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Temurin 17 is unavailable on GitHub's Windows ARM runner. FVX is
          # compiled for Java 17 and runs unchanged on this Java 21 runtime.
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: npm ci
      - name: Bundle FVX and minimal Java runtime
        run: python tools/prepare_desktop_fvx.py --jar .engine/UPR-FVX.jar
      - name: Build native package
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Package Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/nuzlike-${{ matrix.target }}.tar.gz" -C "src-tauri/target/${{ matrix.target }}/release/bundle" .
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path "src-tauri/target/${{ matrix.target }}/release/bundle/*" -DestinationPath "release-assets/nuzlike-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: nuzlike-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  android:
    name: Android ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            rust_target: aarch64-linux-android
            tauri_target: aarch64
            artifact: nuzlike-android-arm64
          - name: x86-64
            rust_target: x86_64-linux-android
            tauri_target: x86_64
            artifact: nuzlike-android-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: fvx-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fvx-engine
          path: .engine
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - run: npm ci
      - name: Initialize Android project
        run: npm run android:init -- --ci
      - name: Install FVX Android bridge
        run: python tools/prepare_android_fvx.py --jar .engine/UPR-FVX.jar
      - name: Build split APKs
        run: npm run android:build -- --target ${{ matrix.tauri_target }} --apk --split-per-abi --ci
      - name: Name release APK
        run: |
          mkdir -p release-assets
          cp src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk "release-assets/${{ matrix.artifact }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*.apk
          if-no-files-found: error

  release:
    name: Publish tagged binaries
    if: startsWith(github.ref, 'refs/tags/')
    needs: [source-checks, desktop, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: nuzlike-*
          path: release-assets
          merge-multiple: true
      - name: Write package checksums
        working-directory: release-assets
        run: sha256sum nuzlike-* > SHA256SUMS
      - name: Create alpha release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPOSITORY" || gh release create "$TAG" --repo "$REPOSITORY" --prerelease --title "[Alpha] NuzLike $TAG" --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" release-assets/* --repo "$REPOSITORY" --clobber
